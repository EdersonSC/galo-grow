<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Galo Grow — Rock na alma</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #0b0b0d;
      --text: #f7f7f7;
      --accent: #ff2e2e;
      --font-title: "Bebas Neue", sans-serif;
      --font-body: "Inter", sans-serif;
    }

    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;padding:0;width:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:var(--font-body)}

    /* NAVBAR RESPONSIVA */
    .navbar{
      position:fixed;top:0;left:0;width:100%;z-index:1000;
      padding:15px 20px;display:flex;align-items:center;justify-content:center;
      transition: 0.3s; background: transparent;
    }
    .navbar.scrolled{ background: rgba(0,0,0,0.9); padding: 10px 20px; }
    
    .nav-container{ width:100%; max-width:1200px; display:flex; align-items:center; justify-content:space-between; }
    
    .brand img{ height: 50px; width: auto; display: block; } /* Logo visível */

    .nav-links{ display: flex; gap: 15px; align-items: center; }
    .nav-links a{ font-weight: 600; font-size: 14px; text-transform: uppercase; text-decoration: none; color: white; }
    .nav-links a.cta{ background: var(--accent); color: black; padding: 8px 15px; border-radius: 5px; }

    /* MENU MOBILE (HAMBURGUER) */
    .menu-icon { display: none; cursor: pointer; font-size: 24px; }

    @media (max-width: 850px) {
      .nav-links { display: none; } /* Esconde menu normal no mobile */
      .menu-icon { display: block; }
      .brand img { height: 40px; }
    }

    /* HERO SLIDER RESPONSIVO */
    .hero-slider{ position:relative; width:100%; height:100vh; overflow:hidden; }
    .hero-slider input{ display: none; }
    
    .slides{ display:flex; width:300%; height:100%; transition: 0.6s ease-in-out; }
    .slide{ width:33.333%; height:100%; position:relative; }
    
    .slide img{ 
      width:100%; height:100%; object-fit:cover; 
      object-position: center; /* Garante que o centro da foto apareça no mobile */
    }

    .overlay{ position:absolute; inset:0; background:rgba(0,0,0,0.5); }

    /* CONTEÚDO DO HERO */
    .hero-content{
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      text-align:center; padding: 20px; z-index: 10;
    }
    .hero-inner{ max-width: 800px; }
    .hero-title{ font-family: var(--font-title); font-size: clamp(3rem, 10vw, 6rem); line-height: 1; margin: 10px 0; }
    .hero-tag{ font-size: clamp(1rem, 4vw, 1.2rem); color: #ccc; margin-bottom: 20px; }

    .cta-row{ display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn{ padding: 12px 25px; border-radius: 50px; font-weight: 800; text-decoration: none; border: 2px solid white; transition: 0.3s; }
    .btn-primary{ background: white; color: black; }
    .btn-outline{ color: white; }

    /* SETAS DO SLIDER */
    .arrows { position: absolute; top: 50%; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; z-index: 20; pointer-events: none; }
    .arrow { 
      pointer-events: auto; cursor: pointer; background: rgba(255,255,255,0.1); 
      width: 50px; height: 50px; display: none; align-items: center; justify-content: center; border-radius: 50%;
    }
    .arrow svg { width: 30px; fill: white; }

    /* LÓGICA DAS SETAS */
    #s1:checked ~ .slides { transform: translateX(0%); }
    #s2:checked ~ .slides { transform: translateX(-33.333%); }
    #s3:checked ~ .slides { transform: translateX(-66.666%); }

    #s1:checked ~ .arrows .s1-next { display: flex; position: absolute; right: 20px; }
    #s2:checked ~ .arrows .s2-prev { display: flex; position: absolute; left: 20px; }
    #s2:checked ~ .arrows .s2-next { display: flex; position: absolute; right: 20px; }
    #s3:checked ~ .arrows .s3-prev { display: flex; position: absolute; left: 20px; }

    /* SEÇÕES DE CONTEÚDO */
    .section { padding: 60px 20px; max-width: 1100px; margin: auto; }
    h2 { font-family: var(--font-title); font-size: 2.5rem; margin-bottom: 20px; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
    .card { background: #151515; padding: 20px; border-radius: 10px; border: 1px solid #333; }

  </style>
</head>
<body>

  <header class="navbar" id="navbar">
    <div class="nav-container">
      <a href="#" class="brand">
        <!-- Verifique se o nome do arquivo está correto abaixo -->
        <img src="img/logo-branco12.png" alt="Galo Grow Logo">
      </a>
      <nav class="nav-links">
        <a href="#sobre">Sobre</a>
        <a href="#agenda">Agenda</a>
        <a href="#midia">Mídia</a>
        <a href="#contato" class="cta">Contrate</a>
      </nav>
      <div class="menu-icon">☰</div>
    </div>
  </header>

  <section class="hero-slider">
    <input type="radio" name="slider" id="s1" checked>
    <input type="radio" name="slider" id="s2">
    <input type="radio" name="slider" id="s3">

    <div class="slides">
      <div class="slide">
        <div class="overlay"></div>
        <img src="img/Banda3.jpeg" alt="Banda Galo Grow">
      </div>
      <div class="slide">
        <div class="overlay"></div>
        <img src="img/Banda.jpeg" alt="Show ao vivo">
      </div>
      <div class="slide">
        <div class="overlay"></div>
        <img src="img/Banda2.jpeg" alt="Integrantes">
      </div>
    </div>

    <div class="hero-content">
      <div class="hero-inner">
        <p style="text-transform: uppercase; letter-spacing: 2px;">Banda para Eventos</p>
        <h1 class="hero-title">GALO GROW</h1>
        <p class="hero-tag">O melhor do Rock e Pop para o seu evento.</p>
        <div class="cta-row">
          <a href="#contato" class="btn btn-primary">Orçamento</a>
          <a href="#agenda" class="btn btn-outline">Ver Agenda</a>
        </div>
      </div>
    </div>

    <div class="arrows">
      <label for="s2" class="arrow s1-next"><svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg></label>
      <label for="s1" class="arrow s2-prev"><svg viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg></label>
      <label for="s3" class="arrow s2-next"><svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg></label>
      <label for="s2" class="arrow s3-prev"><svg viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg></label>
    </div>
  </section>

  <main>
    <section id="sobre" class="section">
      <h2>A Gente Toca de Tudo</h2>
      <div class="grid">
        <div class="card"><h3>Rock Nacional</h3><p>Legião, Capital, Skank e mais.</p></div>
        <div class="card"><h3>Pop Internacional</h3><p>Coldplay, Bruno Mars, Maroon 5.</p></div>
        <div class="card"><h3>Clássicos</h3><p>Queen, Beatles, Bon Jovi.</p></div>
      </div>
    </section>
  </main>

  <script>
    // Efeito de scroll na navbar
    window.onscroll = function() {
      var nav = document.getElementById('navbar');
      if (window.pageYOffset > 100) {
        nav.classList.add('scrolled');
      } else {
        nav.classList.remove('scrolled');
      }
    };
  </script>

</body>
</html>
